[aqmp_servers]
# Replace with your real target node. For a local VM/WSL test, you can use:
# aqmp-local ansible_host=127.0.0.1 ansible_connection=local
aqmp-target ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[aqmp_servers:vars]
ansible_python_interpreter=/usr/bin/python3
