version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: aqmp-backend:local
    container_name: aqmp-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: aqmp-frontend:local
    container_name: aqmp-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
